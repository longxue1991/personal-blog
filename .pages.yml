media:
  - name: post_images
    label: 文章图片
    input: assets/uploads
    output: /personal-blog/assets/uploads
    categories:
      - image
    rename: random

content:
  - name: posts
    label: 博客文章
    type: file
    path: content/posts.json
    format: json
    list: true
    fields:
      - name: id
        label: 文章 ID
        type: uuid
        options:
          editable: false
      - name: title
        label: 标题
        type: string
        required: true
      - name: category
        label: 栏目
        type: string
        default: 随笔
      - name: template
        label: 页面模板
        type: select
        hidden: true
        options:
          values:
            - name: standard
              label: 普通文章
            - name: noip-analysis
              label: NOIP 名单分析
      - name: readMinutes
        label: 阅读分钟数
        type: number
        hidden: true
      - name: summary
        label: 摘要
        type: text
      - name: createdAt
        label: 发布日期
        type: date
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: published
        label: 公开发布
        type: boolean
        default: true
      - name: markdown
        label: Markdown 正文
        type: rich-text
        required: true
        options:
          format: markdown
          switcher: true
          media: post_images
          path: blog
          rename: random
